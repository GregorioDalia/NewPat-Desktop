name: NewPat 0.9.8 Apple Silicon review package

on:
  push:
    branches: ['review/0.9.8-macos-arm64']
    paths: ['.github/workflows/macos-arm64-review.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  macos-installer:
    name: macos-installer (arm64)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: aec701f6f14bbd0f770dd79812b085be1e17096c
          persist-credentials: false
      - name: Set up native Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Check native client (no Linux VM on hosted runners)
        env:
          EXPECTED_ARCHITECTURE: arm64
        run: python .github/scripts/check_macos.py --output build/macos-client-check.json
      - name: Download the exact shared AMD64 scientific archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nipat-runtime-assets
          run-id: 44344894151
          github-token: ${{ github.token }}
          path: build/assets
      - name: Build the self-contained macOS package
        env:
          PACKAGE_ARCHITECTURE: arm64
        run: |
          python scripts/build_macos_installer.py --project . \
            --manifest build/assets/installer-manifest.json \
            --output build/macos-output --architecture "$PACKAGE_ARCHITECTURE"
      - name: Verify the native package and embedded client
        # Successful packaging is not evidence of Lima/Rosetta execution.
        run: |
          package=(build/macos-output/*.pkg)
          test "${#package[@]}" -eq 1
          python scripts/verify_macos_package.py --package "${package[0]}" \
            --manifest build/assets/installer-manifest.json \
            --report build/macos-output/macos-package-verification.json
      - name: Retain the package and bound verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-macos-setup-arm64
          path: build/macos-output/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Retain native client diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-macos-client-arm64
          path: |
            build/macos-client-check.json
            build/macos-output/macos-native-smoke.json
            build/macos-output/macos-native-smoke.png
          retention-days: 14
          if-no-files-found: ignore
