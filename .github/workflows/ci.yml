name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  # Each main push covers its own before..after interval, including rapid successive merges.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_checks: ${{ steps.ownership.outputs.run_checks }}
      duplicate_pr: ${{ steps.ownership.outputs.duplicate_pr }}
      ownership_reason: ${{ steps.ownership.outputs.ownership_reason }}
      acceptance_only: ${{ steps.select.outputs.acceptance_only }}
      acceptance_paths: ${{ steps.select.outputs.acceptance_paths }}
      documentation_scope: ${{ steps.select.outputs.documentation_scope }}
      desktop_scope: ${{ steps.select.outputs.desktop_scope }}
      caller_smoke: ${{ steps.select.outputs.caller_smoke }}
      client: ${{ steps.select.outputs.client }}
      scientific: ${{ steps.select.outputs.scientific }}
      runtime: ${{ steps.select.outputs.runtime }}
      packaging: ${{ steps.select.outputs.packaging }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record the exact checkout identity
        id: source
        run: python .github/scripts/ci_control.py source
      - name: Avoid duplicate branch-push and PR checks
        id: ownership
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/ci_control.py ownership
      - name: Select scientific integration checks
        id: select
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD: ${{ steps.source.outputs.source_commit }}
          CI_EVENT: ${{ github.event_name }}
        run: python .github/scripts/ci_changes.py --base "$CI_BASE" --head "$CI_HEAD" --event "$CI_EVENT" --output "$GITHUB_OUTPUT"

  acceptance:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true' && needs.changes.outputs.acceptance_paths != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout acceptance and source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Verify accepted build identity and scientific evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_PATHS: ${{ needs.changes.outputs.acceptance_paths }}
        run: python .github/scripts/acceptance_ci.py
      - name: Verified acceptance-only push from ${{ github.event.before }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.acceptance_only == 'true'
        run: echo "All acceptance records in the main push were verified."

  documentation:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true' && (needs.changes.outputs.documentation_scope == 'guides' || needs.changes.outputs.documentation_scope == 'image')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout documentation and validation tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate links, examples and packaged documentation
        run: |
          python3.12 .github/scripts/check_docs.py
          python3.12 -m unittest discover -s tests -p test_workflow_plan.py
          python3.12 .github/scripts/check_documentation_package.py

  linux-checks:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true' && needs.changes.outputs.acceptance_only == 'false' && needs.changes.outputs.documentation_scope == 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Prepare the native GTK test desktop
        # Ubuntu mirror downloads can take several minutes on hosted runners.
        timeout-minutes: 12
        run: |
          # On AWS runners the regional mirror repeatedly times out fetching WebKit.
          # Keep it as a fallback after the official Ubuntu archive.
          mirrors=/etc/apt/apt-mirrors.txt
          if [ -f "$mirrors" ]; then
            sudo sed -i -E '/^https?:\/\/us-east-2\.ec2\.archive\.ubuntu\.com\/ubuntu\/?[[:space:]]+priority:1[[:space:]]*$/s/priority:1/priority:4/' "$mirrors"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            python3-cairo python3-gi-cairo xvfb xauth dbus-x11 poppler-utils
      - name: Exercise the source application in native GTK
        # This fails before runtime/package builds; package smoke checks remain separate.
        timeout-minutes: 5
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24" \
            dbus-run-session -- /usr/bin/python3.12 scripts/verify_gui_app.py \
              --app "$GITHUB_WORKSPACE" --python /usr/bin/python3.12 \
              --workspace "$RUNNER_TEMP/newpat-source-native-gui" \
              --report build/source-native-gui/linux-source-smoke.json \
              --screenshot build/source-native-gui/linux-source-smoke.png \
              --scope source-native-application
      - name: Retain source native GTK diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newpat-linux-source-native-gui
          path: build/source-native-gui/
          retention-days: 14
          if-no-files-found: ignore
      - name: Install pinned quality tools
        run: python -m pip install -r .github/quality-requirements.txt
      - name: Exercise GUI interactions with indexed alignments
        timeout-minutes: 5
        run: |
          python -m pip install -r .github/gui-test-requirements.txt
          python scripts/verify_gui_interactions.py --report build/gui-interactions/report.json
      - name: Retain GUI interaction screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newpat-gui-interactions
          path: build/gui-interactions/
          retention-days: 14
          if-no-files-found: ignore
      - name: Correctness-focused Python static checks
        run: python -m ruff check src engine scripts installer/linux .github/scripts
      - name: Python unit tests with branch coverage
        id: python_tests
        run: |
          mkdir -p build/quality
          python -m coverage run -m pytest tests
      - name: Record branch coverage without an arbitrary percentage gate
        id: coverage_reports
        if: ${{ !cancelled() && (steps.python_tests.outcome == 'success' || (steps.python_tests.outcome == 'failure' && hashFiles('.coverage') != '')) }}
        run: |
          python -m coverage json
          python -m coverage xml
          python -m coverage report > build/quality/coverage.txt
      - name: Retain quality baseline and missing branches
        if: ${{ !cancelled() && steps.coverage_reports.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newpat-python-quality
          path: build/quality/
          retention-days: 14
          if-no-files-found: error
      - name: CI selection and release guard tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Validate local documentation links, examples and packaged documentation
        run: |
          python .github/scripts/check_docs.py
          python .github/scripts/check_documentation_package.py
      - name: Check dedicated daemon helper syntax
        run: bash -n installer/runtime/newpat-engine

  windows-checks:
    name: Windows client (Server 2022; simulated Windows 10/11 decisions)
    needs: changes
    if: needs.changes.outputs.run_checks == 'true' && needs.changes.outputs.acceptance_only == 'false' && needs.changes.outputs.documentation_scope == 'none'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Preserve source bytes for manifest verification
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Verify source native WebView2 dependency signatures
        shell: powershell
        run: |
          python scripts/verify_gui_distribution.py --signatures --report build/source-native-gui/windows-native-dependencies.json
          if ($LASTEXITCODE -ne 0) { throw 'Source native GUI dependency verification failed.' }
      - name: Exercise the source application in native WebView2
        timeout-minutes: 8
        shell: powershell
        run: |
          $python = (Get-Command python -CommandType Application).Source
          python scripts/verify_gui_app.py --app "$env:GITHUB_WORKSPACE" --python "$python" `
            --workspace "$env:RUNNER_TEMP/newpat-source-native-gui" `
            --report build/source-native-gui/windows-source-smoke.json `
            --screenshot build/source-native-gui/windows-source-smoke.png `
            --scope source-native-application
          if ($LASTEXITCODE -ne 0) { throw 'Source native WebView2 application smoke failed.' }
      - name: Retain source native WebView2 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newpat-windows-source-native-gui
          path: build/source-native-gui/
          retention-days: 14
          if-no-files-found: ignore
      - name: Run shared Windows unit, installer and launcher checks
        shell: powershell
        env:
          DESKTOP_SCOPE: ${{ needs.changes.outputs.desktop_scope }}
        run: ./.github/scripts/check_windows.ps1 -DesktopOnly:($env:DESKTOP_SCOPE -eq 'focused')
      - name: Retain compiled installer fixture results, including failures
        if: always() && needs.changes.outputs.desktop_scope != 'focused'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newpat-windows-installer-fixture
          path: build/windows-installer-fixture/
          retention-days: 14
          if-no-files-found: error

  macos-checks:
    name: macOS client (${{ matrix.architecture }})
    needs: changes
    if: needs.changes.outputs.run_checks == 'true' && needs.changes.outputs.acceptance_only == 'false' && needs.changes.outputs.documentation_scope == 'none'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up native Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Exercise the source application in native WKWebView
        timeout-minutes: 5
        run: |
          python scripts/verify_gui_app.py --app "$GITHUB_WORKSPACE" --python "$(command -v python)" \
            --workspace "$RUNNER_TEMP/newpat-source-native-gui" \
            --report build/source-native-gui/macos-source-smoke.json \
            --screenshot build/source-native-gui/macos-source-smoke.png \
            --scope source-native-application
      - name: Retain source native WKWebView diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newpat-macos-source-native-gui-${{ matrix.architecture }}
          path: build/source-native-gui/
          retention-days: 14
          if-no-files-found: ignore
      - name: Check native client and packaging contracts (no guest VM)
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          DESKTOP_SCOPE: ${{ needs.changes.outputs.desktop_scope }}
        run: |
          options=()
          if [[ "$DESKTOP_SCOPE" == focused ]]; then options+=(--desktop-only); fi
          python .github/scripts/check_macos.py --output build/macos-client-check.json "${options[@]}"
      - name: Retain bounded client evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newpat-macos-client-${{ matrix.architecture }}
          path: build/macos-client-check.json
          retention-days: 14
          if-no-files-found: ignore

  scientific:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true' && needs.changes.outputs.scientific == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      NEWPAT_RUNTIME_IMAGE: newpat-scientific-runtime:ci-test
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Prepare scientific presentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Check the merged pull request for matching scientific evidence
        id: scientific_reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/scientific_reuse.py restore --promote-image \
            --image "$NEWPAT_RUNTIME_IMAGE" --output-dir build/scientific-reuse \
            --runner-temp "$RUNNER_TEMP" --output "$GITHUB_OUTPUT"
      - name: Set up Buildx
        if: steps.scientific_reuse.outputs.reused != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build scientific runtime using the dependency cache
        if: steps.scientific_reuse.outputs.reused != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/scientific-runtime/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.NEWPAT_RUNTIME_IMAGE }}
          load: true
          pull: true
          provenance: false
          cache-from: type=gha,version=2,scope=newpat-scientific-linux-amd64
          cache-to: type=gha,version=2,scope=newpat-scientific-linux-amd64,mode=max,ignore-error=true
      - name: Exercise the desktop caller plan with the bundled synthetic trio
        run: python .github/scripts/verify_caller_smoke.py --image "$NEWPAT_RUNTIME_IMAGE"
      - name: Verify distribution notices in the built image
        run: |
          set -o pipefail
          sha256sum LICENSE THIRD_PARTY_NOTICES.md |
            docker run --rm -i --network=none --workdir /opt/newpat --entrypoint sha256sum "$NEWPAT_RUNTIME_IMAGE" --check -
      - name: Verify bundled scientific scripts without host sources
        if: steps.scientific_reuse.outputs.reused != 'true'
        env:
          TMPDIR: ${{ runner.temp }}/newpat-engine-check
        run: |
          mkdir -p "$TMPDIR"
          set -o pipefail
          python scripts/verify_engine_package.py --image "$NEWPAT_RUNTIME_IMAGE" 2>&1 | tee "$TMPDIR/verification.log"
      - name: Verify original sample labels and unchanged scientific results
        if: steps.scientific_reuse.outputs.reused != 'true'
        env:
          TMPDIR: ${{ runner.temp }}/newpat-presentation-check
        run: |
          mkdir -p "$TMPDIR"
          set -o pipefail
          python scripts/verify_presentation.py --image "$NEWPAT_RUNTIME_IMAGE" --output-dir "$TMPDIR/artifacts" 2>&1 | tee "$TMPDIR/verification.log"
      - name: Scientific regression and input-mode checks
        if: steps.scientific_reuse.outputs.reused != 'true'
        env:
          NEWPAT_DATA_DIR: ${{ runner.temp }}/newpat-validation/data
          NEWPAT_RUNS_DIR: ${{ runner.temp }}/newpat-validation/runs
        run: |
          mkdir -p "$NEWPAT_DATA_DIR" "$NEWPAT_RUNS_DIR"
          python -m newpat doctor --runtime
          python -m newpat self-test
      - name: Verify optional performance evidence and unchanged DNP results
        if: steps.scientific_reuse.outputs.reused != 'true'
        env:
          TMPDIR: ${{ runner.temp }}/newpat-performance-check
        run: |
          mkdir -p "$TMPDIR"
          set -o pipefail
          python scripts/verify_performance.py --image "$NEWPAT_RUNTIME_IMAGE" --output-dir "$TMPDIR/artifacts" 2>&1 | tee "$TMPDIR/verification.log"
      - name: Verify native scientific edge cases and settings in the installed image
        if: steps.scientific_reuse.outputs.reused != 'true'
        env:
          TMPDIR: ${{ runner.temp }}/newpat-native-r-check
        run: |
          mkdir -p "$TMPDIR"
          set -o pipefail
          docker run --rm --network=none --cpus=4 --memory=8g \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/qualification,readonly" \
            --workdir /qualification --env PYTHONPATH=/opt/newpat/lib:/qualification/src \
            --mount "type=bind,source=$TMPDIR,target=/evidence" \
            --entrypoint python3 "$NEWPAT_RUNTIME_IMAGE" /qualification/.github/scripts/check_native_r.py \
            --report /evidence/native-r.json \
            2>&1 | tee "$TMPDIR/verification.log"
      - name: Verify updated CPI Contamination and CPIN models
        if: steps.scientific_reuse.outputs.reused != 'true'
        env:
          TMPDIR: ${{ runner.temp }}/newpat-five-modules-check
        run: |
          mkdir -p "$TMPDIR"
          set -o pipefail
          python scripts/verify_five_modules.py --image "$NEWPAT_RUNTIME_IMAGE" --output "$TMPDIR/artifacts" --full 2>&1 | tee "$TMPDIR/verification.log"
      - name: Compare scientific cores with immutable versioned references
        if: steps.scientific_reuse.outputs.reused != 'true'
        env:
          TMPDIR: ${{ runner.temp }}/newpat-r-equivalence-check
        run: |
          mkdir -p "$TMPDIR"
          set -o pipefail
          python scripts/verify_r_equivalence.py --image "$NEWPAT_RUNTIME_IMAGE" --output-dir "$TMPDIR/artifacts" 2>&1 | tee "$TMPDIR/verification.log"
      - name: Export qualified scientific Docker image
        id: scientific_image_export
        if: steps.scientific_reuse.outputs.reused != 'true' && github.repository_id == '1307623649' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' "$NEWPAT_RUNTIME_IMAGE")
          docker image save --output "$RUNNER_TEMP/scientific-runtime.tar.partial" "$image_id"
          mv "$RUNNER_TEMP/scientific-runtime.tar.partial" "$RUNNER_TEMP/scientific-runtime.tar"
      - name: Seal successful scientific qualification for exact-image reuse
        if: steps.scientific_reuse.outputs.reused != 'true' && github.repository_id == '1307623649' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        id: scientific_qualification
        run: |
          python .github/scripts/scientific_reuse.py seal \
            --image "$NEWPAT_RUNTIME_IMAGE" --output-dir build/scientific-qualification \
            --runtime-archive "$RUNNER_TEMP/scientific-runtime.tar"
          echo "source_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Retain reusable scientific qualification
        if: steps.scientific_reuse.outputs.reused != 'true' && github.repository_id == '1307623649' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        # A failed/cancelled check never produces reusable evidence. Attempts
        # have separate immutable artifacts; ordinary diagnostics remain below.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newpat-scientific-qualification-${{ github.run_attempt }}-${{ steps.scientific_qualification.outputs.source_tree }}
          path: build/scientific-qualification/
          retention-days: 14
          if-no-files-found: error
      - name: Retain qualified scientific Docker image
        if: steps.scientific_qualification.outcome == 'success' && steps.scientific_image_export.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newpat-scientific-image-${{ github.run_attempt }}-${{ steps.scientific_qualification.outputs.source_tree }}
          path: ${{ runner.temp }}/scientific-runtime.tar
          retention-days: 3
          compression-level: 1
          if-no-files-found: error
      - name: Retain scientific diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newpat-ci-scientific-logs
          path: |
            ${{ runner.temp }}/newpat-validation/runs/**/run.json
            ${{ runner.temp }}/newpat-validation/runs/**/execution.log
            ${{ runner.temp }}/newpat-engine-check/
            ${{ runner.temp }}/newpat-presentation-check/
            ${{ runner.temp }}/newpat-performance-check/
            ${{ runner.temp }}/newpat-r-equivalence-check/
            ${{ runner.temp }}/newpat-five-modules-check/
            ${{ runner.temp }}/newpat-native-r-check/
            build/scientific-reuse/reuse.json
          retention-days: 14
          if-no-files-found: ignore

  caller-smoke:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true' && needs.changes.outputs.caller_smoke == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      NEWPAT_RUNTIME_IMAGE: newpat-scientific-runtime:ci-test
    steps:
      - name: Checkout desktop and synthetic inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Load the scientific runtime for the two callers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/scientific-runtime/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.NEWPAT_RUNTIME_IMAGE }}
          load: true
          pull: true
          provenance: false
          cache-from: type=gha,version=2,scope=newpat-scientific-linux-amd64
      - name: Verify the desktop caller plan and expected counts
        run: python .github/scripts/verify_caller_smoke.py --image "$NEWPAT_RUNTIME_IMAGE"

  runtime:
    needs: [changes, linux-checks, windows-checks]
    if: needs.changes.outputs.run_checks == 'true' && needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout runtime source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the changed dedicated runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: installer/runtime/Dockerfile
          platforms: linux/amd64
          tags: newpat-wsl-rootfs:ci-test
          load: true
          pull: true
          provenance: false
          cache-from: type=gha,version=2,scope=newpat-wsl-rootfs-linux-amd64
          cache-to: type=gha,version=2,scope=newpat-wsl-rootfs-linux-amd64,mode=max,ignore-error=true
      - name: Exercise daemon startup and exact component provenance
        # Isolated Linux runtime integration; this does not claim Windows/WSL acceptance.
        run: |
          docker run --rm --privileged --cgroupns=host \
            --mount type=volume,target=/var/lib/docker --mount type=volume,target=/var/lib/containerd \
            --entrypoint /bin/bash \
            newpat-wsl-rootfs:ci-test -euc \
            '/usr/local/bin/newpat-engine ensure; /usr/local/bin/newpat-engine ensure; docker info --format "{{.OSType}}"; docker compose version; test -s /etc/newpat-runtime.json'

  packaging:
    needs: [changes, linux-checks, windows-checks]
    if: needs.changes.outputs.run_checks == 'true' && needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout package contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Exercise package contents, manifest and actual DEB fixture construction
        run: |
          python -m unittest discover -s tests -p 'test_*installer*.py' -v
          python -m unittest discover -s tests -p 'test_distribution.py' -v
          python -m unittest discover -s .github/scripts -p 'test_verify_installer_set.py' -v

  required:
    # Branch protection requires this stable job name, including documentation-only PRs.
    # A delegated branch push cannot satisfy the protected PR/main context.
    name: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && 'branch-required' || 'required' }}
    if: always()
    needs: [changes, documentation, linux-checks, windows-checks, macos-checks, scientific, caller-smoke, runtime, packaging, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout gate implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require all applicable checks
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python .github/scripts/ci_control.py gate
