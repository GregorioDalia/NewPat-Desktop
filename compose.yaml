name: newpat

services:
  scientific:
    image: ${NEWPAT_RUNTIME_IMAGE:-newpat-scientific-runtime:0.9.99}
    build:
      context: .
      dockerfile: docker/scientific-runtime/Dockerfile
    user: ${NEWPAT_UID:-0}:${NEWPAT_GID:-0}
    working_dir: /opt/newpat
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    environment:
      TZ: Europe/Rome
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      HOME: /tmp
      TMPDIR: /tmp
